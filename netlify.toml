[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [
      "node_modules/.cache",
      "website/node_modules/.cache",
      ".pnpm-store",
      "website/.pnpm-store",
      "docs/.pnpm-store"
    ]
