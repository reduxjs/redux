[build]
  base    = "website"
  publish = "website/build"
  command = "cd ../docs && pnpm install --frozen-lockfile && cd ../website && pnpm install --frozen-lockfile && pnpm build && cp _redirects ./build"
  ignore  = "git diff --quiet HEAD^ HEAD -- ../docs/ ."

[build.environment]
# pnpm 11 requires Node 22.13 or newer.
NODE_VERSION = "22"
NODE_OPTIONS = "--max_old_space_size=4096"
# Netlify detects pnpm from the lockfile; Corepack reads the version from
# `packageManager` in website/package.json.
NETLIFY_USE_PNPM = "true"

# Pages that use the `LiveExample` StackBlitz embed. WebContainers need the host
# page to be cross-origin isolated. Any other cross-origin iframe on these pages
# (CodeSandbox, YouTube, Egghead) is blocked unless it also sends COEP, so a page
# is added here only once every embed on it has been converted to `LiveExample`
# or `VideoEmbed`.
[[headers]]
  for = "/tutorials/essentials/part-2-app-structure"
  [headers.values]
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/tutorials/essentials/part-2-app-structure/*"
  [headers.values]
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Opener-Policy = "same-origin"

