[build]
  base    = "website"
  publish = "website/build"
  command = "cd ../docs && pnpm install --frozen-lockfile && cd ../website && pnpm install --frozen-lockfile && pnpm fetch-docs --force && pnpm build && cp _redirects ./build"
  # Skip the build when nothing under docs/, website/, or this file changed since
  # the last build of this branch. Builds triggered by a build hook (used by the
  # other library repos when their docs change) ignore this command entirely.
  ignore  = "[ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ../docs/ . ../netlify.toml"

[build.environment]
# pnpm 11 requires Node 22.13 or newer.
NODE_VERSION = "22"
NODE_OPTIONS = "--max_old_space_size=4096"
# Netlify detects pnpm from the lockfile; Corepack reads the version from
# `packageManager` in website/package.json.
NETLIFY_USE_PNPM = "true"
# Branches in the other library repos that carry the combined-site cleanup
# (pages that now live only on the core site). Switch back to "master" once
# those PRs merge.
DOCS_REF_REDUX_TOOLKIT = "combined-docs"
DOCS_REF_REACT_REDUX = "combined-docs"

# Pages that use the `LiveExample` StackBlitz embed. WebContainers need the host
# page to be cross-origin isolated. Any other cross-origin iframe on these pages
# (CodeSandbox, YouTube, Egghead) is blocked unless it also sends COEP, so a page
# is added here only once every embed on it has been converted to `LiveExample`
# or `VideoEmbed`.
[[headers]]
  for = "/tutorials/essentials/part-2-app-structure"
  [headers.values]
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/tutorials/essentials/part-2-app-structure/*"
  [headers.values]
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Opener-Policy = "same-origin"

